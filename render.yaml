# Public synthetic workspaces: no paid instance, disk or database.
# Optional free-only OpenRouter demo. Enter its key in Render, never in this file.
services:
  - type: web
    name: finn-demo
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: FINN_PUBLIC_DEMO
        value: "1"
      - key: FINN_INTERACTIVE_DEMO
        value: "1"
      - key: FINN_TRUST_PROXY
        value: "1"
      - key: FINN_ENABLE_LLM
        value: "1"
      - key: FINN_PUBLIC_LLM
        value: "1"
      - key: FINN_LLM_PROVIDER
        value: "openrouter"
      - key: FINN_OPENROUTER_MODEL
        value: "openrouter/free"
      - key: FINN_AUTO_REFRESH
        value: "0"
