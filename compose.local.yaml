# Use a runtime image built with the current requirements.txt (M6.4 adds PDFium).
# Build it first: docker compose -f compose.yaml up --build --wait
# Start with: docker compose -f compose.yaml -f compose.local.yaml up --no-build --pull never --wait
services:
  app:
    image: ${FINN_RUNTIME_IMAGE:-enamholdings-app:latest}
    pull_policy: never
    volumes:
      - ./finn:/app/finn:ro
      - ./tests:/app/tests:ro
