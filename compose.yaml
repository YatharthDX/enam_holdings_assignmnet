services:
  app:
    build: .
    ports:
      - "${FINN_PORT:-8080}:8080"
    volumes:
      - finn_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  finn_data:
