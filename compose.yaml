services:
  app:
    build: .
    ports:
      - "${FINN_PORT:-8080}:8080"
    volumes:
      - finn_data:/data
    environment:
      FINN_PUBLIC_DEMO: "${FINN_PUBLIC_DEMO:-0}"
      FINN_INTERACTIVE_DEMO: "${FINN_INTERACTIVE_DEMO:-0}"
      FINN_TRUST_PROXY: "${FINN_TRUST_PROXY:-0}"
      FINN_SESSION_SECRET: "${FINN_SESSION_SECRET:-}"
      FINN_ENABLE_LLM: "${FINN_ENABLE_LLM:-0}"
      FINN_LLM_PROVIDER: "${FINN_LLM_PROVIDER:-auto}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      FINN_GEMINI_MODEL: "${FINN_GEMINI_MODEL:-gemini-3.8-flash}"
      FINN_OPENAI_MODEL: "${FINN_OPENAI_MODEL:-}"
      FINN_RESEARCH_MODEL: "${FINN_RESEARCH_MODEL:-}"
      FINN_LLM_TIMEOUT_SECONDS: "${FINN_LLM_TIMEOUT_SECONDS:-240}"
      FINN_AUTO_REFRESH: "${FINN_AUTO_REFRESH:-1}"
      FINN_REFRESH_SECONDS: "${FINN_REFRESH_SECONDS:-900}"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  finn_data:
